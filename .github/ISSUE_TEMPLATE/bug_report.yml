name: UI bug report
description: Report a defect in the kubeseal-ui frontend
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach plaintext, ciphertext, tokens, cookies, or credential-bearing URLs.**
        API-level defects belong in `kubeseal-ui/api`.
  - type: input
    id: ui-version
    attributes:
      label: UI version
      description: Image tag or commit SHA.
      placeholder: v0.3.0 / 88088d3
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 130
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Login and session
        - Namespace and secret lists
        - Secret editor
        - Reveal and patch
        - Delivery (dry run, push, proposal)
        - Accessibility
        - Theme, contrast, or layout
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the API error code if the UI surfaced one, and console errors with tokens and values removed.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID
      description: From the failing request, if the UI displayed one.
    validations:
      required: false
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: I have removed plaintext, ciphertext, tokens, cookies, and credential-bearing URLs from this report.
          required: true
