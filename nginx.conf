server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unmatched route so vue-router
    # can take over client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html stays short-lived so new
    # bundle hashes are picked up immediately.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Forward /api requests to the kubeseal-ui-api service. In-cluster DNS
    # is used here; in production this should be replaced by the in-cluster
    # Service name (e.g. http://kubeseal-ui-api:8080) via ConfigMap.
    location /api/ {
        proxy_pass http://kubeseal-ui-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
